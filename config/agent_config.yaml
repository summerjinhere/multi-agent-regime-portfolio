# Agent Portfolio System Configuration (FIXED)
# =============================================
# Optimized for better performance and higher market exposure

market_data:
  start_date: '2015-01-01'
  end_date: '2025-11-29'
  cache_dir: 'data'
  cache_ttl_hours: 24
  min_data_quality: 0.5
  
  # Asset universe
  sectors:
    Technology: [AAPL, MSFT, NVDA, AVGO, ORCL, ADBE, CRM, AMD]
    Healthcare: [LLY, UNH, JNJ, MRK, ABBV, TMO, AMGN, PFE]
    Financials: [JPM, V, MA, BAC, WFC, MS, GS, AXP]
    Consumer_Discretionary: [AMZN, TSLA, HD, MCD, NKE, LOW, SBUX]
    Energy: [XOM, CVX, COP, EOG, SLB, MPC, PSX]
  
  bonds: [TLT, IEF, SHY, LQD, HYG]
  commodities: [GLD, USO, SLV]
  others: ['^VIX', VNQ]

ml:
  n_components: 3
  covariance_type: 'full'
  n_iter: 1000
  feature_window: 10
  min_observations: 100

quant:
  lookback_window: 252
  forecast_horizon: 5
  det_order: -1
  k_ar_diff: 1
  use_shrinkage: true
  regime_adjustment: true

risk:
  # FIXED: Higher tolerance for drawdown
  max_drawdown_limit: 0.20
  var_confidence: 0.95
  position_sizing_method: 'risk_parity'
  
  # FIXED: Higher position limits
  max_position: 0.30
  max_leverage: 1.0
  var_limit: 0.05
  
  # FIXED: Less aggressive regime penalties
  regime_params:
    0:  # Bull
      risk_multiplier: 1.0
      max_position: 0.30
      max_leverage: 1.0
      slippage_bps: 5
      stop_loss: 0.05
    1:  # Transition
      risk_multiplier: 0.95
      max_position: 0.25
      max_leverage: 1.0
      slippage_bps: 10
      stop_loss: 0.04
    2:  # Bear
      risk_multiplier: 0.85
      max_position: 0.20
      max_leverage: 0.9
      slippage_bps: 20
      stop_loss: 0.03

portfolio:
  use_black_litterman: true
  rebalance_threshold: 0.03
  max_turnover: 0.40
  transaction_cost_bps: 10
  risk_free_rate: 0.02

orchestrator:
  timeout_seconds: 60
  retry_attempts: 3

backtest:
  initial_capital: 1000000
  start_date: '2020-01-01'
  rebalance_freq: 'M'
